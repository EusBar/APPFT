name: fintrack
description: "FINTRACK — Your Money. Under Control."
publish_to: none
version: 0.18.1+23

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.6.0
  cryptography: ^2.7.0
  file_picker: ^13.3.3
  fintrack_core:
    path: packages/fintrack_core
  flutter_local_notifications: ^23.0.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  in_app_purchase: ^3.3.1
  path: ^1.9.0
  pdf: ^3.13.1
  share_plus: ^13.3.1
  sqflite_sqlcipher: ^3.1.0
  timezone: ^0.11.2
  xml: ^7.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/
    - assets/backgrounds/countries/
    - assets/legal/

# Ícone do app (gerado no CI com `dart run flutter_launcher_icons`).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0B0F14"
  adaptive_icon_foreground: assets/icon/foreground.png
  remove_alpha_ios: true
