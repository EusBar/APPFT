name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Núcleo — análise e testes
        working-directory: packages/fintrack_core
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Gerar pastas de plataforma em falta
        run: flutter create --platforms=android,ios --org ao.fintrack --project-name fintrack .

      - name: Configurar Android e iOS (nome, biometria, tema)
        run: tool/configure_platforms.sh

      - name: Assinatura fixa (se os segredos existirem)
        env:
          KEYSTORE_BASE64: ${{ secrets.FINTRACK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FINTRACK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FINTRACK_KEY_ALIAS }}
        run: |
          python3 tool/configure_signing.py
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/fintrack-upload.jks
            {
              echo "storeFile=fintrack-upload.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=${KEY_ALIAS:-fintrack}"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > android/key.properties
            echo "APK assinado com a chave fixa do FINTRACK."
          else
            echo "::warning::Sem segredos de assinatura: APK assinado com chave de teste."
          fi

      - name: Dependências
        run: flutter pub get

      - name: Ícone do app
        run: dart run flutter_launcher_icons

      - name: Análise
        run: flutter analyze --no-fatal-infos

      - name: Testes
        run: flutter test

      - name: Compilar APK (ofuscado)
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - uses: actions/upload-artifact@v4
        with:
          name: fintrack-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Compilar pacote para a Google Play (.aab)
        if: github.event_name == 'workflow_dispatch'
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: fintrack-play-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols
          if-no-files-found: error

  ios:
    # Confirma que a versão iPhone compila. A instalação no iPhone (TestFlight)
    # precisa da conta de programador Apple e da assinatura.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar pastas (o gerador de ícones precisa das duas)
        run: flutter create --platforms=android,ios --org ao.fintrack --project-name fintrack .

      - name: Configurar iOS
        run: python3 tool/configure_ios.py

      - name: Dependências
        run: flutter pub get

      - name: Ícone do app
        run: dart run flutter_launcher_icons

      - name: Compilar iOS (sem assinatura)
        run: flutter build ios --release --no-codesign

  ios-testflight:
    # Só quando pedido à mão (Actions → Build → Run workflow) e com a conta
    # Apple Developer pronta. Assina e envia para o TestFlight.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Confirmar segredos da Apple
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$TEAM_ID" ]; then
            echo "::error::Faltam os segredos APPLE_ASC_KEY_ID, APPLE_ASC_ISSUER_ID, APPLE_ASC_KEY_P8 e APPLE_TEAM_ID."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar projeto iOS
        run: |
          flutter create --platforms=android,ios --org ao.fintrack --project-name fintrack .
          python3 tool/configure_ios.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols \
            --build-number=${{ github.run_number }}

      - name: Assinar e enviar para o TestFlight
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$ASC_KEY_ID.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath build/Runner.xcarchive -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic $AUTH archive
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/ipa $AUTH
          rm -f ~/private_keys/AuthKey_$ASC_KEY_ID.p8
