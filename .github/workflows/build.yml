name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Núcleo — análise e testes
        working-directory: packages/fintrack_core
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Gerar pastas de plataforma em falta
        run: flutter create --platforms=android,ios --org ao.fintrack --project-name fintrack .

      - name: Configurar Android e iOS (nome, biometria, tema)
        run: tool/configure_platforms.sh

      - name: Assinatura fixa (se os segredos existirem)
        env:
          KEYSTORE_BASE64: ${{ secrets.FINTRACK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FINTRACK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FINTRACK_KEY_ALIAS }}
        run: |
          python3 tool/configure_signing.py
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/fintrack-upload.jks
            {
              echo "storeFile=fintrack-upload.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=${KEY_ALIAS:-fintrack}"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > android/key.properties
            echo "APK assinado com a chave fixa do FINTRACK."
          else
            echo "::warning::Sem segredos de assinatura: APK assinado com chave de teste."
          fi

      - name: Dependências
        run: flutter pub get

      - name: Ícone do app
        run: dart run flutter_launcher_icons

      - name: Análise
        run: flutter analyze --no-fatal-infos

      - name: Testes
        run: flutter test

      - name: Compilar APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: fintrack-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    # Confirma que a versão iPhone compila. A instalação no iPhone (TestFlight)
    # precisa da conta de programador Apple e da assinatura.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar pasta iOS
        run: flutter create --platforms=ios --org ao.fintrack --project-name fintrack .

      - name: Configurar iOS
        run: python3 tool/configure_ios.py

      - name: Dependências
        run: flutter pub get

      - name: Ícone do app
        run: dart run flutter_launcher_icons

      - name: Compilar iOS (sem assinatura)
        run: flutter build ios --release --no-codesign
