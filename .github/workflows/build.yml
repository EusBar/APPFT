name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Núcleo — análise e testes
        working-directory: packages/fintrack_core
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Gerar pastas de plataforma em falta
        run: flutter create --platforms=android,ios --org ao.fintrack --project-name fintrack .

      - name: Dependências
        run: flutter pub get

      - name: Análise
        run: flutter analyze --no-fatal-infos

      - name: Testes
        run: flutter test

      - name: Compilar APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: fintrack-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
